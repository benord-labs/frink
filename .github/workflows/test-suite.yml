name: Full test suite

on:
  pull_request:
  push:
    branches:
      - main
      - '0.0.9'
      - '0.0.10'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: full-test-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners are dedicated 4-vCPU boxes; the config's maxWorkers: 2 is sized for a loaded dev machine.
env:
  VITEST_MAX_WORKERS: 3

jobs:
  pull-request-suite:
    if: github.event_name == 'pull_request'
    name: Full suite (${{ matrix.side }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        side:
          - base
          - head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      # Both sides collect coverage so instrumentation slows them equally. reportOnFailure keeps the
      # summary when tests fail; the floor is checked by its own step, never through Vitest's exit code.
      - name: Run full suite and preserve its report
        shell: bash
        run: |
          set +e
          bun run test:run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json" \
            --coverage.enabled --coverage.reportOnFailure --coverage.reporter=json-summary
          STATUS=$?
          set -e
          test -f "$RUNNER_TEMP/vitest.json" || {
            echo "::error::Vitest exited without producing its JSON report"
            exit 1
          }
          printf '%s\n' "$PWD" > "$RUNNER_TEMP/root.txt"
          printf '%s\n' "$STATUS" > "$RUNNER_TEMP/exit-code.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.side }}-suite-report
          path: |
            ${{ runner.temp }}/vitest.json
            ${{ runner.temp }}/root.txt
            ${{ runner.temp }}/exit-code.txt
          if-no-files-found: error
          retention-days: 5

      - name: Coverage floor
        if: ${{ !cancelled() && matrix.side == 'head' }}
        run: node scripts/testing/check-coverage-floor.mjs coverage/coverage-summary.json

  compare-pull-request-suite:
    if: always() && github.event_name == 'pull_request'
    name: Full suite (new failures)
    needs:
      - pull-request-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-suite-report'
          path: reports

      - name: Block introduced or changed failures
        run: |
          node scripts/testing/compare-vitest-failures.mjs \
            reports/base-suite-report/vitest.json \
            "$(cat reports/base-suite-report/root.txt)" \
            "$(cat reports/base-suite-report/exit-code.txt)" \
            reports/head-suite-report/vitest.json \
            "$(cat reports/head-suite-report/root.txt)" \
            "$(cat reports/head-suite-report/exit-code.txt)"

  # Pull requests are judged on the findings they add (compare-pull-request-gates below); main itself
  # is held to every gate absolutely, on each push and nightly, so a red main stays visible here.
  deterministic-quality-gates:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    name: Deterministic quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        id: install
        run: bun install --frozen-lockfile

      # Each gate runs even when an earlier gate fails, so one red gate cannot hide another.
      - name: Formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check

      - name: Oxlint (errors fail; warnings advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint:oxlint

      - name: Structure and import walls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint:structure

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run ts:check

      - name: Unused files, exports and dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run knip

  # Kept out of the gates job above so this check can be required on its own.
  skill-content-drift:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Generated skill content is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Check generated skill content
        run: bun run build:skills:check

  pull-request-gates:
    if: github.event_name == 'pull_request'
    name: Quality gate findings (${{ matrix.side }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        side:
          - base
          - head
    steps:
      # "head" is the merge result (github.sha): a branch cut before main was cleaned must not be
      # charged with main's old findings. Both sides run head's collector, since base may predate
      # it, kept outside the workspace so the gates never lint it as part of the checkout under test.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Keep head's collector
        run: cp scripts/testing/collect-quality-gate-findings.mjs "$RUNNER_TEMP/"

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Collect every gate's findings
        run: node "$RUNNER_TEMP/collect-quality-gate-findings.mjs" "$RUNNER_TEMP/gates.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.side }}-gates-report
          path: ${{ runner.temp }}/gates.json
          if-no-files-found: error
          retention-days: 5

  compare-pull-request-gates:
    if: always() && github.event_name == 'pull_request'
    name: Deterministic quality gates
    needs:
      - pull-request-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-gates-report'
          path: reports

      - name: Block findings the pull request introduces
        run: |
          node scripts/testing/compare-quality-gates.mjs \
            reports/base-gates-report/gates.json \
            reports/head-gates-report/gates.json

  branch-suite:
    if: github.event_name != 'pull_request'
    name: Full suite (branch health)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run full suite
        run: bun run test:run --coverage.enabled --coverage.reportOnFailure --coverage.reporter=json-summary

      - name: Coverage floor
        if: ${{ !cancelled() }}
        run: node scripts/testing/check-coverage-floor.mjs coverage/coverage-summary.json
