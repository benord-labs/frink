<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://*.posthog.com https://*.i.posthog.com; worker-src 'self' blob:; frame-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:* http://127.0.0.1:* https://unpkg.com https://cdn.jsdelivr.net https://data.jsdelivr.com https://*.posthog.com https://*.i.posthog.com; img-src 'self' data: blob: https: frink-attachment:; media-src 'self' blob:;" />
    <title>Frink</title>
    <!-- Prevent theme flash: detect system/stored theme before render -->
    <script>
      (() => {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'light' ? 'light' : stored === 'dark' ? 'dark' : (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
        // A non-stock theme's window colour, saved by ThemeEffects (lib/themes/paint-theme.ts)
        var bootBg = JSON.parse(localStorage.getItem('frink:boot-bg') || '{}')[theme];
        if (bootBg) document.documentElement.style.setProperty('--loading-bg', bootBg);
      })();
    </script>
    <style>
      /* Loading state before React loads — respects system theme */
      :root {
        --loading-bg: #ffffff;
        --loading-logo: #a1a1aa;
        --loading-primary: #7C3AED;
        --loading-secondary: #65D992;
      }

      .dark {
        --loading-bg: #050505;
        /* Purple brand logo in dark — matches --primary: 258 90% 76% */
        --loading-logo: #A78BFA;
        --loading-primary: #A78BFA;
        --loading-secondary: #7DF0A8;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        background-color: var(--loading-bg);
      }

      /* Loading container - hidden when React renders */
      .loading-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--loading-bg);
        z-index: 9999;
        transition: opacity 150ms ease-out;
      }

      /* Shared atmosphere class — used by the HTML bootstrap loader AND the
         React <PageLoader /> Suspense fallback, matching the marketing canvas. */
      .dark .loading-atmosphere {
        background-image:
          radial-gradient(
            120% 95% at 92% 92%,
            color-mix(in srgb, var(--loading-primary) 6%, transparent) 0%,
            transparent 52%
          ),
          radial-gradient(
            140% 60% at 50% 108%,
            color-mix(in srgb, var(--loading-secondary) 3%, transparent) 0%,
            transparent 45%
          ),
          radial-gradient(90% 75% at 6% 10%, rgb(255 255 255 / 0.045) 0%, transparent 46%),
          radial-gradient(64% 52% at 80% 4%, rgb(255 255 255 / 0.035) 0%, transparent 50%),
          linear-gradient(
            180deg,
            rgb(255 255 255 / 0.04) 0%,
            transparent 22%
          );
      }

      @media (prefers-contrast: more) {
        .dark .loading-atmosphere {
          background-image: none;
        }
      }

      /* Hide loading when root has content */
      /* visibility (after the fade) and no animation: an invisible pulse still ticks every frame */
      #root:not(:empty) + .loading-container,
      #root:not(:empty) ~ .loading-container {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 150ms ease-out, visibility 0s 150ms;
      }

      #root:not(:empty) ~ .loading-container .loading-logo {
        animation: none;
      }

      .loading-logo {
        width: 68px;
        height: 68px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .loading-logo path {
        fill: var(--loading-logo);
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Loading indicator - separate from root so :empty works -->
    <div class="loading-container loading-atmosphere">
      <svg class="loading-logo" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <title>Frink loading icon</title>
        <path d="M350.3 166.97L244.64 229.85C237.67 234 233.44 241.34 233.46 249.24C233.59 291.18 233.7 333.12 233.84 375.04L149.69 426.42V219.37C149.69 204.69 157.5 191.03 170.37 183.19L350.3 73.59V166.97Z"/>
        <path d="M350.3 199.41V285.79L260.18 340.79V263.8C260.18 257.46 263.57 251.57 269.15 248.22L350.3 199.41Z"/>
      </svg>
    </div>
    <script>
      window.onerror = (msg, _url, _line) => {
        const root = document.getElementById("root");
        if (root) {
          const pre = document.createElement("pre");
          pre.style.cssText = "color:red;padding:20px";
          pre.textContent = `Error: ${msg}`;
          root.innerHTML = "";
          root.appendChild(pre);
        }
      };
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
